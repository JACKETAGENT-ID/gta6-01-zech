<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copperhead County — an open-world crime game</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="errlog" aria-hidden="true"></div>
</div>
<script>
window.__errors = [];
window.addEventListener('error', function (e) {
  window.__errors.push(String(e.message || e.error));
  var d = document.getElementById('errlog');
  if (d) d.textContent = window.__errors.join('\n');
});
window.addEventListener('unhandledrejection', function (e) {
  window.__errors.push('rejection: ' + String(e.reason));
});
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
